name: Deep Wounds experiment
on:
    push:
        branches: [fix/warrior-deep-wounds-triggering-hand]
permissions:
    contents: read
jobs:
    mechanics:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x
            - uses: ./.github/actions/setup-protoc
            - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
            - run: make sim/core/proto/api.pb.go binary_dist/dist.go
            - name: Check hand contribution, AP and refresh timing
              run: go test --tags=with_db ./sim/warrior -run '^TestDeepWoundsUsesTheCrittingHandWithoutAttackPower$' -count=1 -v
            - name: Check Warrior mechanics
              run: go test --tags=with_db ./sim/warrior -count=1
            - name: Prepare clean comparison rotations
              run: python3 tools/deep_wounds_experiment/prepare.py
            - name: Prepare weapon pairs from current data
              run: python3 tools/deep_wounds_experiment/weapon_prepare.py
            - name: Screen different weapon pairs
              env:
                  EXPERIMENT_SOURCE: ${{ github.sha }}
                  EXPERIMENT_REQUIRE_CLEAN_APL: '1'
              run: go run --tags=with_db ./tools/deep_wounds_experiment experiment-weapon-inputs.json experiment-weapon-screen.json
            - name: Select candidates for confirmation
              run: python3 tools/deep_wounds_experiment/weapon_shortlist.py
            - name: Confirm with more iterations and two durations
              env:
                  EXPERIMENT_SOURCE: ${{ github.sha }}
                  EXPERIMENT_REQUIRE_CLEAN_APL: '1'
              run: go run --tags=with_db ./tools/deep_wounds_experiment experiment-weapon-confirm-inputs.json experiment-weapon-confirm.json
            - name: Summarize weapon results
              run: python3 tools/deep_wounds_experiment/weapon_summarize.py
            - name: Archive inputs, preflight stats and full results
              uses: actions/upload-artifact@v4
              with:
                  name: deep-wounds-weapon-results
                  path: experiment-*.json
